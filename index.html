<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Print Care</title>
<meta name="description" content="Print Care — Job Register, Order Booking, प्रोडक्शन, Billing">
<meta name="theme-color" content="#1e3a8a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Print Care">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin: 0; height: 100%; background: #eef2f9; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
  #ld { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        font: 16px "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif; color: #1e3a8a; background: #eef2f9; z-index: 2; transition: opacity .3s; }
  #ld img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 6px 20px rgba(30, 58, 138, .25); }
  #ld.hide { opacity: 0; pointer-events: none; }
  #inst { position: fixed; right: 12px; bottom: 76px; z-index: 3; display: none; border: 0; border-radius: 22px; padding: 10px 16px;
          background: linear-gradient(135deg, #4f7bff, #1e3a8a); color: #fff; font: 600 14px "Segoe UI", Roboto, sans-serif;
          box-shadow: 0 4px 14px rgba(0, 0, 0, .25); cursor: pointer; }
  #inst span { margin-left: 8px; opacity: .8; }
  #ntf { position: fixed; left: 12px; bottom: 76px; z-index: 3; display: none; border: 0; border-radius: 22px; padding: 10px 16px; background: #fff; color: #1e3a8a; font: 600 14px "Segoe UI", Roboto, sans-serif; box-shadow: 0 4px 14px rgba(0, 0, 0, .25); cursor: pointer; }
  #ntf span { margin-left: 8px; color: #888; }
</style>
</head>
<body>
<div id="ld"><img src="icon-192.png" alt=""><div>Print Care खुल रहा है…</div></div>
<iframe id="app" title="Print Care" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen; geolocation"></iframe>
<button id="ntf" type="button">🔔 सूचना चालू करें <span id="ntfX">✕</span></button>
<button id="inst" type="button">📲 Print Care इंस्टॉल करें <span id="instX">✕</span></button>
<script>
  /* Print Care ऐप-पेज: असली ऐप (Google Apps Script) इसी पेज के अंदर खुलता है — इससे Google वाली पट्टी नहीं आती,
     और ये पेज फ़ोन / कंप्यूटर पर "Install" होकर अपना ऐप बन जाता है। पासवर्ड वाला लिंक (?i=कोड) अंदर तक जाता है। */
  var EXEC = 'https://script.google.com/macros/s/AKfycbyapK5gRciZ_YeirqLfGo6qR9cRKwTNhxOu08vNgyQn1824TbsJtqxwSey_tkDBvn_66A/exec';
  var p = new URLSearchParams(location.search), code = (p.get('i') || p.get('invite') || '').replace(/[^A-Za-z0-9]/g, '');
  var src = EXEC + '?app=1' + (code ? '&i=' + encodeURIComponent(code) : '');
  var f = document.getElementById('app'), ld = document.getElementById('ld');
  f.addEventListener('load', function () { setTimeout(function () { ld.className = 'hide'; }, 600); });
  setTimeout(function () { ld.className = 'hide'; }, 15000);
  f.src = src;
  if (code && history.replaceState) history.replaceState(null, '', location.pathname);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
  /* 📲 Install: Chrome / Edge का अपना "Install" — बटन दबाते ही */
  var deferred = null, btn = document.getElementById('inst');
  var standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
  var hidden = false; try { hidden = localStorage.getItem('pc_inst_hide') === '1'; } catch (e) {}
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    if (!standalone && !hidden) btn.style.display = 'block';
  });
  btn.addEventListener('click', function (e) {
    if (e.target.id === 'instX') { btn.style.display = 'none'; try { localStorage.setItem('pc_inst_hide', '1'); } catch (x) {} return; }
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.then(function () { deferred = null; btn.style.display = 'none'; });
  });
  window.addEventListener('appinstalled', function () { btn.style.display = 'none'; });
  /* 🔔 ऐप के अंदर से: आइकन पर गिनती (1 2 3) और फ़ोन की सूचना */
  window.addEventListener('message', function (e) {
    var o = String(e.origin || ''), m = e.data || {};
    if (!/\.googleusercontent\.com$/.test(o) && o !== 'https://script.google.com') return;
    if (m.pc === 'badge') {
      var n = Math.max(0, parseInt(m.n, 10) || 0);
      document.title = (n ? '(' + n + ') ' : '') + 'Print Care';
      try { if (navigator.setAppBadge) { if (n) navigator.setAppBadge(n); else navigator.clearAppBadge(); } } catch (x) {}
    } else if (m.pc === 'notify' && window.Notification && Notification.permission === 'granted') {
      navigator.serviceWorker.ready.then(function (r) { r.showNotification(String(m.title || 'Print Care'), { body: String(m.body || ''), tag: String(m.tag || ''), icon: 'icon-192.png', badge: 'icon-192.png', renotify: false }); }).catch(function () {});
    }
  });
  /* 🔔 Push (Firebase): ऐप बंद हो तब भी सूचना — टोकन अंदर वाले ऐप को देते हैं, वो सर्वर पर सेव करता है */
  var FB = { apiKey: 'AIzaSyCOhCpg4FQIW3ErQ8Puw5v7SCaP8Ni-MWM', authDomain: 'print-care.firebaseapp.com', projectId: 'print-care', storageBucket: 'print-care.firebasestorage.app', messagingSenderId: '590771225829', appId: '1:590771225829:web:c384eaa557db8c3a45c00c' };
  var VAPID = 'BK3uWjt9b_g2UWm7WmgAgAzMnvsGx-EQ0dDvk_PPPdF_tlg2R7vnlYBRBXj1siAy2oilbKyqAoRcYyBqvtRxORs';
  var fbP = null, askSrc = null, askOrg = '';
  function loadJs(u) { return new Promise(function (ok, no) { var x = document.createElement('script'); x.src = u; x.onload = ok; x.onerror = no; document.head.appendChild(x); }); }
  function fbLoad() { if (!fbP) fbP = loadJs('https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js').then(function () { return loadJs('https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js'); }).then(function () { if (!firebase.apps.length) firebase.initializeApp(FB); }); return fbP; }
  function sendTok() {
    if (!askSrc || !window.Notification || Notification.permission !== 'granted' || !('serviceWorker' in navigator)) return;
    fbLoad().then(function () { return navigator.serviceWorker.ready; })
      .then(function (reg) { return firebase.messaging().getToken({ vapidKey: VAPID, serviceWorkerRegistration: reg }); })
      .then(function (t) { if (t && askSrc) askSrc.postMessage({ pc: 'fcm', token: t }, askOrg); })
      .catch(function (x) { console.log('fcm', x); });
  }
  window.addEventListener('message', function (e) {
    var o = String(e.origin || ''), m = e.data || {};
    if (m.pc === 'getFcm' && /\.googleusercontent\.com$/.test(o)) { askSrc = e.source; askOrg = o; sendTok(); }
  });
  var nb = document.getElementById('ntf'), nHide = false; try { nHide = localStorage.getItem('pc_ntf_hide') === '1'; } catch (e) {}
  if (window.Notification && Notification.permission === 'default' && !nHide) setTimeout(function () { nb.style.display = 'block'; }, 8000);
  nb.addEventListener('click', function (e) {
    nb.style.display = 'none';
    if (e.target.id === 'ntfX') { try { localStorage.setItem('pc_ntf_hide', '1'); } catch (x) {} return; }
    Notification.requestPermission().then(function (p) { if (p === 'granted') { sendTok(); navigator.serviceWorker.ready.then(function (r) { r.showNotification('Print Care', { body: '🔔 सूचनाएँ चालू हो गईं — ऐप बंद हो तब भी आएँगी', icon: 'icon-192.png' }); }); } });
  });
</script>
</body>
</html>
